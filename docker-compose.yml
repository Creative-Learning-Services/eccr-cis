services:
  neo4j:
    image: neo4j:latest
    container_name: neo4j-demo
    volumes:
      - ./logs:/logs
      - ./config:/config
      - ./data:/data
      - ./plugins:/plugins
      - ./init.cypher:/var/lib/neo4j/init.cypher
      - ./init-neo4j.sh:/usr/local/bin/init-neo4j.sh # Mount the startup script
    environment:
      - NEO4J_AUTH=none
      - NEO4J_PLUGINS=["apoc"] # install APOC
    # Overwrite the command to run our custom startup script
    command: ["/bin/bash", "/usr/local/bin/init-neo4j.sh"]
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - eccr-network
    healthcheck:
      # Use auth for health check to avoid repeated unauthorized warnings
      test:
        [
          "CMD",
          "bash",
          "-c",
          "cypher-shell -u neo4j -p $NEO4J_PASSWORD 'RETURN 1'",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  eccr-backend:
    build: .
    container_name: eccr-backend
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_BOLT_URI=${NEO4J_BOLT_URI}
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - PYTHONUNBUFFERED=1
    working_dir: /app/app
    command: python manage.py runserver 0.0.0.0:8080
    networks:
      - eccr-network

networks:
  eccr-network:
    driver: bridge
