services:
  neo4j:
    image: neo4j:latest
    ports:
      - 7474:7474
      - 7687:7687
    volumes:
      - ./neo4j:/data:rw
    environment:
      - NEO4J_AUTH=none

  
  db:
    image: postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: "${DB_NAME}"
#      POSTGRES_USER: 'root'
      POSTGRES_PASSWORD: "${DB_PASSWORD}"

  
  app:
    container_name: cis
    build:
      context: .
    ports:
      - "8000:8020"
    command: >
      sh -c ". /opt/app/start-app.sh"
    environment:
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      SECRET_KEY_VAL: "${SECRET_KEY_VAL}"
      LOG_PATH: "${LOG_PATH}"
      NEO4J_BOLT_URI: "${NEO4J_BOLT_URI}"
      NEO4J_URI: "${NEO4J_URI}"
      NEO4J_USERNAME: "${NEO4J_USERNAME}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
    volumes:
      - ./app:/opt/app/eccr-cis
    depends_on:
      - db
      - neo4j